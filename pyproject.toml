[project]
name = "evoroute"
version = "0.1.0"
description = "Evolutionary routing optimization for local LLMs"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "datasets>=3.0",
    "psutil>=6.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
evoroute = "evoroute.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evoroute"]

[tool.pytest.ini_options]
testpaths = ["tests"]
